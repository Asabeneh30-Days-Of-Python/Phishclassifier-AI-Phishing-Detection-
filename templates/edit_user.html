
{% extends "base.html" %}
{% block title %}Edit User - {{ user.username }}{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2>Edit User: {{ user.username }}</h2>
  <form method="post">
    <div class="form-group">
      <label for="is_admin">Admin Status</label>
      <select class="form-control" id="is_admin" name="is_admin">
        <option value="true" {% if user.is_admin %}selected{% endif %}>True</option>
        <option value="false" {% if not user.is_admin %}selected{% endif %}>False</option>
      </select>
    </div>
    <!-- Extend with more settings as necessary -->
    <button type="submit" class="btn btn-success">Save Changes</button>
  </form>
</div>
{% endblock %}
